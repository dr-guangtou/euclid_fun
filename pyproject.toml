[project]
name = "euclid-dr1"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.2",
    "astroquery>=0.4.11",
    "beautifulsoup4>=4.15.0",
    "lsdb>=0.11.1",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "photutils>=3.1.1",
    "psutil>=7.2.2",
    "pymupdf>=2.1",
    "pyvo>=1.10.0",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.4",
]

[tool.uv.sources]
astroquery = { git = "https://github.com/astropy/astroquery.git", rev = "main" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
